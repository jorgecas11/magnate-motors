<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="color-scheme" content="light dark"><title>Magnate Motors — Multijugador</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#eef0f4;--panel:#ffffff;--panel2:#f4f6fa;--border:#d7dbe6;--text:#171b26;--muted:#5c6479;--accent:#a9781f;--accent-ink:#241a06;--accent2:#2f6fe0;--good:#1f8a5c;--good-bg:#e4f5ec;--bad:#c8433a;--bad-bg:#fbeaea;--shadow:0 1px 2px rgba(20,24,38,.06),0 8px 24px -12px rgba(20,24,38,.18);--font-display:"Rajdhani","Arial Narrow",sans-serif;--font-body:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0e15;--panel:#141a28;--panel2:#1b2233;--border:#2a3346;--text:#eef1f7;--muted:#8b96af;--accent:#e0ac52;--accent-ink:#1c1406;--accent2:#6f9dff;--good:#3ecf8e;--good-bg:rgba(62,207,142,.14);--bad:#ef6b62;--bad-bg:rgba(239,107,98,.14);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);}}:root[data-theme="dark"]{--bg:#0b0e15;--panel:#141a28;--panel2:#1b2233;--border:#2a3346;--text:#eef1f7;--muted:#8b96af;--accent:#e0ac52;--accent-ink:#1c1406;--accent2:#6f9dff;--good:#3ecf8e;--good-bg:rgba(62,207,142,.14);--bad:#ef6b62;--bad-bg:rgba(239,107,98,.14);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);}*{box-sizing:border-box;}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;}#app{max-width:540px;margin:0 auto;min-height:100vh;padding-bottom:48px;}h1,h2,h3{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em;text-wrap:balance;}h1{font-size:1.6rem;margin:.3em 0;color:var(--accent);font-weight:700;}h2{font-size:1.15rem;margin:.6em 0 .4em;font-weight:700;}h3{font-size:1rem;margin:.5em 0 .25em;color:var(--accent);font-weight:600;}p{line-height:1.5;margin:.4em 0;}.muted{color:var(--muted);font-size:.85em;}.fine{color:var(--muted);font-size:.75em;margin-top:1.5em;line-height:1.5;}.screen{padding:16px 16px 30px;}.btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:.95rem;font-family:var(--font-body);font-weight:600;cursor:pointer;}.btn:active{transform:scale(.97);}.btn:disabled{opacity:.5;cursor:default;}.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}.btn.big{display:block;width:100%;padding:15px;font-size:1.02rem;margin-top:18px;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em;}.btn.small{padding:7px 11px;font-size:.82rem;}.row{display:flex;gap:10px;margin:10px 0;}.btnpair{display:flex;gap:8px;flex-wrap:wrap;}.prow{display:flex;gap:8px;margin-bottom:8px;}.prow input{flex:1;}.prow select{flex:1;}.botcheck{display:flex;align-items:center;gap:5px;font-size:.78rem;color:var(--muted);white-space:nowrap;padding:0 4px;}.botcheck input{width:auto;}select,input[type=number],input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:.95rem;font-family:var(--font-body);}.hdr{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 16px 8px;border-bottom:1px solid var(--border);}.hdr-top{display:flex;justify-content:space-between;margin-bottom:8px;gap:8px;flex-wrap:wrap;}.badge{background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:4px 11px;font-size:.72rem;font-family:var(--font-display);letter-spacing:.04em;text-transform:uppercase;font-weight:600;}.badge.good{background:var(--good-bg);border-color:var(--good);color:var(--good);}.badge.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);}.hdr-players{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}.mini-player{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px 10px;min-width:118px;font-size:.72rem;display:flex;flex-direction:column;gap:2px;flex:0 0 auto;box-shadow:var(--shadow);}.mini-player.me{border-color:var(--accent);}.mini-player b{font-size:.82rem;font-family:var(--font-display);letter-spacing:.02em;}.frow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:8px;flex-wrap:wrap;box-shadow:var(--shadow);}.frow input{width:82px;}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow);}.card.winner{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset,var(--shadow);}.totalline{font-weight:700;margin:12px 0;color:var(--accent);font-family:var(--font-display);letter-spacing:.02em;font-size:1.05rem;}.salerow{padding:5px 0;border-bottom:1px dashed var(--border);font-size:.9rem;}.salerow:last-child{border-bottom:none;}.wait{display:flex;align-items:center;justify-content:center;min-height:70vh;padding:20px;text-align:center;}.wait-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:40px 26px;width:100%;max-width:380px;box-shadow:var(--shadow);}.wait-name{font-size:1.5rem;color:var(--accent);font-weight:700;margin:10px 0;font-family:var(--font-display);}.pulse{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.4s ease-in-out infinite;margin-bottom:14px;}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85);}50%{opacity:1;transform:scale(1.1);}}.setup{padding:22px 16px;}.final{padding:22px 16px;text-align:center;}.idbtn{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:1rem;font-family:var(--font-body);font-weight:600;color:var(--text);cursor:pointer;}.idbtn:active{transform:scale(.98);}.idbtn .sub{display:block;font-weight:400;color:var(--muted);font-size:.82rem;margin-top:2px;}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:10px;font-size:.85rem;box-shadow:var(--shadow);z-index:50;max-width:90vw;text-align:center;}.subm-list{font-size:.85rem;margin:8px 0;}.whoami{font-size:.72rem;color:var(--muted);padding:2px 16px 8px;}@media (prefers-reduced-motion: reduce){*{transition:none !important;}.pulse{animation:none;}}</style></head><body>
